    <script id="nexusSharedRuntime">
/* 통합 버전의 원본은 메인 index.html의 NEXUS_BUILD_VERSION과 #nexusRelease입니다. */
(function(){
  'use strict';
  var release=window.NEXUS_RELEASE;
  if(!release || typeof release.version!=='string' || !release.version) throw new Error('Invalid Nexus release');
  var rootUrl=new URL(window.NEXUS_ROOT_URL,document.baseURI);
  var rootDirectory=new URL('./',rootUrl);
  var isDps=window.NEXUS_PAGE==='dps';
  // 로컬 파일에서는 숨겨진 메인 문서가 공통 코드를 전달합니다.
  if(!isDps && window.location.protocol==='file:' && new URLSearchParams(window.location.search).get('nexusBundle')==='1' && window.parent!==window){
    window.NEXUS_REDIRECTING=true;
    window.parent.postMessage({
      type:'nexus:bundle',
      release:release,
      runtime:document.getElementById('nexusSharedRuntime').textContent,
      style:document.getElementById('nexusSharedStyle').textContent
    },'*');
    return;
  }
  var cacheVersion=release.version;
  var checking=false;
  var startScreenKey='nexusStartScreen';

  function startScreen(){
    try{
      var saved=localStorage.getItem(startScreenKey);
      if(saved==='main' || saved==='dps') return saved;
    }catch(error){}
    return release.startScreen==='dps'?'dps':'main';
  }
  function calculatorUrl(){
    var url=new URL('./dps/index.html',rootDirectory);
    url.searchParams.set('v',cacheVersion);
    if(new URLSearchParams(window.location.search).get('intro')==='preview') url.searchParams.set('intro','preview');
    return url;
  }

  function normalizeKey(key){return String(key || '').replace(/^\.\//,'').replace(/^\//,'');}
  function assetVersion(key){return cacheVersion;}
  function assetUrl(src,key){
    var version=assetVersion(key || src);
    var separator=src.indexOf('?')===-1?'?':'&';
    return src+separator+'v='+encodeURIComponent(version);
  }
  function sharedAssetUrl(path){
    var key=normalizeKey(path);
    return new URL(key,rootDirectory).href+'?v='+encodeURIComponent(cacheVersion);
  }
  function parseRelease(html){
    var doc=new DOMParser().parseFromString(html,'text/html');
    var node=doc.getElementById('nexusRelease');
    var value=node && JSON.parse(node.textContent);
    var match=html.match(/window\.NEXUS_BUILD_VERSION\s*=\s*["']([^"']+)["']/);
    if(!value || !match) throw new Error('Nexus release missing');
    value.version=match[1];
    return value;
  }
  function signature(value){
    return JSON.stringify([value.version,value.startScreen || 'main',value.intro || {}]);
  }
  function cleanUpdateParams(){
    if(window.location.protocol==='file:') return;
    try{
      var url=new URL(window.location.href);
      var changed=false;
      ['fresh','__nexus_check','__dps_check'].forEach(function(name){
        if(url.searchParams.has(name)){url.searchParams.delete(name);changed=true;}
      });
      if(changed) window.history.replaceState(null,'',url.pathname+url.search+url.hash);
    }catch(error){}
  }
  function checkIndexUpdate(){
    if(checking || !window.fetch || window.location.protocol==='file:') return;
    checking=true;
    var url=new URL(rootUrl.href);
    url.searchParams.set('__nexus_check',String(Date.now()));
    fetch(url.href,{cache:'no-store'}).then(function(response){
      if(!response.ok) throw new Error('Nexus release request failed');
      return response.text();
    }).then(function(html){
      var latest=parseRelease(html);
      if(signature(latest)===signature(release)) return;
      var key='nexus-auto-refresh:'+window.location.pathname+':'+signature(latest);
      try{
        if(sessionStorage.getItem(key)==='1') return;
        sessionStorage.setItem(key,'1');
      }catch(error){}
      window.dispatchEvent(new Event('nexus:before-update'));
      var next=new URL(window.location.href);
      next.searchParams.set('fresh',latest.version);
      next.searchParams.set('v',latest.version);
      next.searchParams.delete('__nexus_check');
      next.searchParams.delete('__dps_check');
      window.location.replace(next.href);
    }).catch(function(){}).finally(function(){checking=false;});
  }

  window.NEXUS_BUILD_VERSION=release.version;
  window.NEXUS_CACHE_VERSION=cacheVersion;
  window.APP_VERSION=release.version;
  window.NEXUS_ASSET_VERSIONS={};
  window.nexusAssetVersion=assetVersion;
  window.nexusAssetUrl=assetUrl;
  window.nexusSharedAssetUrl=sharedAssetUrl;
  window.nexusCheckIndexUpdate=checkIndexUpdate;
  window.nexusCleanUpdateParams=cleanUpdateParams;
  if(isDps){
    // 기존 계산/저장 코드가 사용하는 이름은 유지하고, 값은 통합 설정에서 받습니다.
    window.DPS_BUILD_VERSION=release.version;
    window.DPS_ASSET_VERSIONS={};
    window.dpsAssetVersion=assetVersion;
    window.dpsAssetUrl=assetUrl;

    window.dpsCleanUpdateParams=cleanUpdateParams;

  if(!isDps){
    var params=new URLSearchParams(window.location.search);
    var explicit=params.get('view');
    var requestedCalculator=explicit==='dps' || params.get('nexusView')==='dps';
    if(params.get('nexusStandalone')!=='build' && (requestedCalculator || (explicit!=='main' && startScreen()==='dps'))){
      window.NEXUS_REDIRECTING=true;
      window.location.replace(calculatorUrl().href);
    }
  }

  if(!document.getElementById('nexusSharedStyle')){
    var sharedStyle=document.createElement('style');
    sharedStyle.id='nexusSharedStyle';
    sharedStyle.textContent=window.NEXUS_SHARED_STYLE || '';
    document.head.appendChild(sharedStyle);
  }

  function mountStartScreenSetting(){
    var host=document.querySelector(isDps?'.hdr-meta':'.gh-right');
    if(!host || document.getElementById('nexusStartScreenMenu')) return;
    var wrap=document.createElement('div');
    wrap.className='nexus-start-wrap';
    wrap.innerHTML='<button type="button" class="nexus-start-trigger" aria-label="첫 화면 설정" title="첫 화면 설정" aria-haspopup="menu" aria-expanded="false" aria-controls="nexusStartScreenMenu"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m3 10 9-7 9 7M5 9v11h14V9M9 20v-7h6v7"/></svg></button>';
    var trigger=wrap.firstElementChild;
    var menu=document.createElement('div');
    menu.id='nexusStartScreenMenu';

  var introState={active:false,ready:false,released:false,started:0,done:null,timer:0,frame:0,boot:null,skip:false};

  function startIntroStars(canvas){
    var context=canvas.getContext('2d');

    var seed=47;
    function random(){seed=(seed*16807)%2147483647;return (seed-1)/2147483646;}

    <script>
        (function(){
            function copyTextFallback(text){
                var area=document.createElement('textarea');
                area.value=text;
                area.setAttribute('readonly','');
                area.style.position='fixed';
                area.style.left='-9999px';
                document.body.appendChild(area);
                area.select();
                try{document.execCommand('copy');}catch(e){}
                area.remove();
            }
            window.nexusCopyBootErrorCode=function(code, btn){
                var done=function(){ if(btn){ var old=btn.textContent; btn.textContent='복사됨'; setTimeout(function(){btn.textContent=old;},1200); } };
                if(navigator.clipboard && window.isSecureContext){
                    navigator.clipboard.writeText(code).then(done).catch(function(){ copyTextFallback(code); done(); });
                }else{
                    copyTextFallback(code); done();
                }
            };
            window.nexusShowBootError=function(code, err){
                window.__nexusBootError=true;
                if(window.nexusCancelIntro) window.nexusCancelIntro();
                try{window.NEXUS_LAST_BOOT_ERROR={code:code,error:err||'unknown',time:Date.now()};}catch(e){}
                try{
                    document.documentElement.classList.add('nexus-booting','nexus-boot-error');
                    var boot=document.getElementById('nexusBootScreen');
                    if(boot){
                        boot.removeAttribute('aria-hidden');
                        boot.innerHTML='<div class="boot-card"><div class="boot-title">넥서스 초기화에 실패했습니다</div><div class="boot-desc">새로고침 후에도 반복되면 제작자에게 아래 오류코드를 전달해주세요.</div><div class="boot-error-code" aria-label="오류코드">'+code+'</div><div class="boot-actions"><button class="boot-action-btn" id="nexusBootCopyBtn" type="button">오류코드 복사</button><button class="boot-action-btn primary" type="button" onclick="window.location.reload()">새로고침</button></div></div>';
                        var copyBtn=document.getElementById('nexusBootCopyBtn');
                        if(copyBtn) copyBtn.onclick=function(){ window.nexusCopyBootErrorCode(code, copyBtn); };
                    }
                }catch(e){}
            };
            function releaseBootScreen(){
                if(window.__nexusBootError) return;
                if(window.nexusFinishIntro && !window.__nexusIntroReleased){window.nexusFinishIntro(releaseBootScreen);return;}
                try{document.documentElement.classList.remove('nexus-booting','nexus-boot-error');}catch(e){}
                try{
                    var boot=document.getElementById('nexusBootScreen');
                    if(boot) boot.setAttribute('aria-hidden','true');
                }catch(e){}
            }
            window.nexusMarkAppReady=function(){
                window.__nexusAppReady=true;
                requestAnimationFrame(function(){ requestAnimationFrame(releaseBootScreen); });
            };
            setTimeout(function(){
                if(!window.__nexusAppReady && !window.__nexusBootError && typeof window.nexusShowBootError === 'function'){
                    window.nexusShowBootError('N1000', new Error('boot timeout'));
                }
            },8000);
        })();

<script>
        (function(){
            if(window.NEXUS_REDIRECTING) return;
            var files = ['data.js','config.js','app.js'];
            function loadNext(index){
                if(index >= files.length) return;
                var src = files[index];
                var script = document.createElement('script');
                script.src = window.nexusAssetUrl(src, src);
                script.async = false;
                script.onload = function(){ loadNext(index + 1); };
                script.onerror = function(){
                    if(typeof window.nexusShowBootError === 'function') window.nexusShowBootError('N1002', new Error(src + ' load failed'));
                };
                document.body.appendChild(script);
            }
            loadNext(0);
        })();
    </script>
